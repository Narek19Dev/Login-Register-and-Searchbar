<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SA:MP Python Launcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>SA:MP Launcher</h1>

    <div class="form-row">
      <label>Server (ip:port)</label>
      <input id="server" type="text" placeholder="127.0.0.1:7777" />
    </div>

    <div class="form-row">
      <label>Nickname</label>
      <input id="nickname" type="text" placeholder="Player" />
    </div>

    <div class="form-row">
      <label>Password (optional)</label>
      <input id="password" type="password" placeholder="" />
    </div>

    <div class="form-row">
      <label>Skin URL Template</label>
      <input id="skinUrl" type="text" placeholder="https://example.com/skins/{nickname}.png" />
    </div>

    <div class="btn-row">
      <button id="save">Save</button>
      <button id="downloadSkin">Download Skin</button>
      <button id="connect">Connect</button>
    </div>

    <div id="status" class="status"></div>

    <div id="skinPreview" class="skin-preview hidden">
      <h3>Skin Preview</h3>
      <img id="skinImg" alt="Skin Preview" />
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
