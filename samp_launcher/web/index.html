<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SA:MP Python Launcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>SA:MP Launcher</h1>

    <div class="form-row">
      <label>Nickname</label>
      <input id="nickname" type="text" placeholder="Player" />
    </div>

    <div class="form-row">
      <label>Sborka URL (.zip/.7z/.rar)</label>
      <input id="sborkaUrl" type="text" placeholder="https://example.com/your-sborka.zip" />
    </div>

    <div class="form-row">
      <label>Wine path (Linux)</label>
      <input id="winePath" type="text" placeholder="/usr/bin/wine" />
    </div>

    <div class="form-row">
      <label>Relative path to samp.exe in sborka</label>
      <input id="sampRel" type="text" placeholder="samp.exe" />
    </div>

    <div class="btn-row">
      <button id="save">Save</button>
      <button id="download">Download Sborka</button>
      <button id="launch">Launch</button>
    </div>

    <div class="progress">
      <div id="progressBar" class="progress-bar" style="width: 0%"></div>
    </div>
    <div id="status" class="status"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
